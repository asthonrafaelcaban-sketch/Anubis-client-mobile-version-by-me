
name: Build Anubis Client

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract source
        run: |
          unzip -q anubis-1.0-src-github-build.zip -d source

      - name: Build JAR
        run: |
          cd source/anubis-1.0-src
          chmod +x gradlew
          ./gradlew --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Anubis-1.0-JAR
          path: source/anubis-1.0-src/build/libs/*.jar
          
